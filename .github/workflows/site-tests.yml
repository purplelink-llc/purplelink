name: Site tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - run: npm install
      - name: Node tests (netlify functions)
        run: node --experimental-test-module-mocks --test netlify/tests/*.test.mjs
      - name: Site integrity tests
        run: python3 -m unittest discover -s site-tests -t site-tests -v
