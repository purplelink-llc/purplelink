[build]
  publish = "site"
  # Every push to main deploys, and most pushes come from unattended jobs (the
  # weekly content routines, the daily digest cron) that never run deploy.sh.
  # Run the same stdlib-only generation steps here so a git deploy ships the
  # shared nav and footer, fresh asset stamps, search index, feed and
  # llms-full.txt even when the pusher forgot. The sitemap is left out: its
  # lastmod dates come from git history, which a shallow build clone lacks.
  # check_content reports problems without failing, so one bad page never
  # blocks the digest; check_og_images fails the build, as in deploy.sh.
  # Builds are batched to save build minutes: a push to main builds only for the digest cron's final daily commit
  # or a commit message containing "[deploy now]", and only when it changed a build input. Everything else waits for
  # the scheduled build hook (06:00 and 17:00 US Eastern, from Ben's Mac); hook builds are never skipped. See the script.
  ignore = "bash ./scripts/netlify_ignore.sh"
  command = "python3 scripts/apply_layout.py && python3 scripts/fingerprint_assets.py && python3 scripts/fingerprint_assets.py --check && python3 scripts/gen_search_index.py && python3 scripts/gen_blog_feed.py && python3 scripts/gen_llms_full.py && python3 scripts/check_og_images.py && python3 scripts/check_content.py && python3 scripts/check_games.py"

[functions]
  directory = "netlify/functions"

[functions."games-share"]
  included_files = ["netlify/functions/fonts/**"]
  external_node_modules = ["@resvg/resvg-js"]

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
    # style-src 'unsafe-inline' + the Google/AdSense origins below are a
    # deliberate, owner-authorized exception to the site's normal strict CSP
    # (see CLAUDE.md "AdSense exception") to allow Google AdSense to render.
    # AdSense injects inline ad-container styles and loads script/frame/img
    # content from these origins; without this the ad units silently fail.
    #
    # api.crossref.org, openlibrary.org, and export.arxiv.org in connect-src
    # are the citation generator's DOI, ISBN, and arXiv-ID lookups. They are
    # called directly from the browser and return Access-Control-Allow-Origin:
    # *. Without them every lookup fails with "Network error" (DOI/ISBN found
    # 2026-08-05; export.arxiv.org was missing entirely and confirmed still
    # broken 2026-09-20 during a site-wide CSP audit — arXiv-ID lookups had
    # never worked since the tool shipped).
    #
    # googleads.g.doubleclick.net and www.google.com in connect-src are for
    # AdSense, which pings them via fetch/sendBeacon. They once also served the
    # ModernTex Google Ads conversion tag (gtag.js), removed 2026-10-19 when
    # the campaign was turned off; www.googletagmanager.com left the policy then.
    #
    # fundingchoicesmessages.google.com is where the AdSense "European
    # regulations" consent message (Google's certified CMP, configured under
    # Privacy & messaging in the AdSense console) loads its script, frame and
    # beacons from. The adsbygoogle.js loader pulls it in; it is not a separate
    # tag on the page. Without it here the consent message is blocked by CSP
    # and EEA/UK/Swiss visitors get no consent prompt, which fails Google's
    # consent requirement (support.google.com/adsense/answer/13554116).
    #
    # 'wasm-unsafe-eval' (2026-11-02): lets a page compile WebAssembly, which the HEIC to JPG converter needs for its
    # self-hosted libheif decoder (/assets/vendor/libheif-1.23.5/, run in a worker that Netlify serves with this same
    # header). It does not allow eval() or new Function(); 'unsafe-eval' stays out. It is sitewide because scoping it
    # would need the /* policy to skip the converter paths, and a more specific header block adds headers rather than
    # removing the /* ones (two CSP headers are both enforced). With
    # 'unsafe-inline' already in script-src it adds little: any script that can run here could already run JavaScript.
    # docs/designs/browser-file-converters.md, "CSP: one added keyword".
    Content-Security-Policy = "default-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data: https://alb.reddit.com https://pagead2.googlesyndication.com https://googleads.g.doubleclick.net https://www.google.com https://www.gstatic.com https://fundingchoicesmessages.google.com https://media.ethicalads.io https://www.google-analytics.com https://www.googleadservices.com https://ad.doubleclick.net https://*.adtrafficquality.google; script-src 'self' 'unsafe-inline' 'wasm-unsafe-eval' https://www.redditstatic.com https://static.cloudflareinsights.com https://pagead2.googlesyndication.com https://googleads.g.doubleclick.net https://www.googletagservices.com https://tpc.googlesyndication.com https://fundingchoicesmessages.google.com https://media.ethicalads.io https://www.googleadservices.com https://www.google.com https://*.adtrafficquality.google; connect-src 'self' https://alb.reddit.com https://pixel-config.reddit.com https://ben-ampel--purplelink-latextools-web.modal.run https://api.crossref.org https://openlibrary.org https://export.arxiv.org https://cloudflareinsights.com https://pagead2.googlesyndication.com https://fundingchoicesmessages.google.com https://server.ethicalads.io https://www.google-analytics.com https://*.google-analytics.com https://*.analytics.google.com https://googleads.g.doubleclick.net https://www.google.com https://www.googleadservices.com https://ad.doubleclick.net https://*.adtrafficquality.google; frame-src 'self' blob: https://www.youtube-nocookie.com https://googleads.g.doubleclick.net https://tpc.googlesyndication.com https://fundingchoicesmessages.google.com https://*.adtrafficquality.google https://www.google.com; object-src 'self' blob:"

# Fonts and self-hosted vendor scripts are inherently stable — keep them
# immutable. The catch-all /assets/* rule below uses a shorter cache so that
# non-fingerprinted assets (logos, icons, OG cards) can be replaced in place
# without serving stale copies for up to a year.
#
# Netlify applies headers from matching [[headers]] blocks in file order, and
# the LAST matching block wins for a given header key — not the most specific
# one. The catch-all used to sit after the two specific rules below and was
# silently winning for every font and vendor file, serving the 30-day policy
# instead of the immutable 1-year one (confirmed live: `curl -I` on a fonts
# URL returned max-age=2592000, not 31536000). It must stay first so the
# fonts/vendor rules that follow are the ones actually applied.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000, stale-while-revalidate=604800"

[[headers]]
  for = "/assets/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/assets/vendor/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# CSS and JS are fingerprinted: scripts/fingerprint_assets.py stamps every
# reference in site/*.html as ?v=<hash of the file's bytes>, so changing an
# asset changes its URL. That makes these safe to cache forever, and a fix
# reaches people on their next page load rather than whenever the old copy
# happened to expire. Before this, styles.css and site.js were cached for a
# day, which twice on 2026-09-04 left a deployed fix invisible to anyone who
# had already loaded the site.
#
# The stamp is what makes `immutable` correct here, so it must never be
# skipped: the build command above stamps every page and then runs --check,
# which fails the build if any reference is unstamped. The committed pages are
# bare (docs/designs/generated-files-at-build.md); deploy.sh stamps a clean tree
# with --force-in-place and restores it afterwards.
# These four keep a one-day cache for any page that loads them unstamped (the
# removed digest archive was the original reason). Fingerprinted pages still get
# a fix instantly, because ?v= makes the changed asset a new URL that no cached
# copy can answer.
[[headers]]
  for = "/styles.css"
  [headers.values]
    Cache-Control = "public, max-age=86400, stale-while-revalidate=604800"

[[headers]]
  for = "/site.js"
  [headers.values]
    Cache-Control = "public, max-age=86400, stale-while-revalidate=604800"

[[headers]]
  for = "/analytics.js"
  [headers.values]
    Cache-Control = "public, max-age=86400, stale-while-revalidate=604800"

[[headers]]
  for = "/ethicalads.js"
  [headers.values]
    Cache-Control = "public, max-age=86400, stale-while-revalidate=604800"

# The site chat's key sounds (site/buddy-chat/sounds/) never change in place; a new sound gets a new name.
# chat.js and links.json are loaded unstamped by loader.js, so they keep the default revalidating cache.
[[headers]]
  for = "/buddy-chat/sounds/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Everything under /tools/ is referenced only from stamped pages, so it can be
# cached hard. This also retires the revalidation round-trip those stylesheets
# and scripts were paying on every single page load.
[[headers]]
  for = "/tools/*.css"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/tools/*.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# /games/ scripts and styles carry ?v=<hash> stamps like the tools above. The puzzle data
# files are not stamped (a new horoscope week replaces stars.json in place), so they get a
# short cache.
[[headers]]
  for = "/games/*.css"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/games/*.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/games/data/*"
  [headers.values]
    Cache-Control = "public, max-age=300, must-revalidate"

[[headers]]
  for = "/sitemap.xml"
  [headers.values]
    Content-Type = "application/xml; charset=utf-8"
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/robots.txt"
  [headers.values]
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/llms.txt"
  [headers.values]
    Content-Type = "text/plain; charset=utf-8"
    Cache-Control = "public, max-age=86400"

# Grant Review was a waitlist test (2026-10-01 to 2026-10-31) closed with no signups; old links go to Paper Review.
# Watchlight moved off purplelink.llc (2026-11-01, Ben: it goes to GSU's technology-transfer office instead).
# Its privacy policy and terms answer 410 Gone, served with the 404 page's body: nothing on this site replaces them,
# and a 301 to /privacy/ or /terms/ would wrongly suggest Purplelink's general policies cover the app.
[[redirects]]
  from = "/watchlight/*"
  to = "/404.html"
  status = 410
  force = true

# Undershelf waitlist closed (product on hold). The old page now goes to the guide it grew out of.
[[redirects]]
  from = "/undershelf/*"
  to = "/guides/mac-mini-under-desk-heat/"
  status = 301

# Focus Radio retired 2026-11-08: the live stream ended 2026-10-16 and the ambient music now lives on the
# Hearthside Pixels YouTube channel.
[[redirects]]
  from = "/focus-radio/*"
  to = "https://www.youtube.com/@PixelHearthMusic"
  status = 301
  force = true

# Budgetcast (finance app) was killed 2026-10-14; its waitlist page is gone.
[[redirects]]
  from = "/budgetcast/*"
  to = "/404.html"
  status = 410
  force = true

[[redirects]]
  from = "/grant-review/*"
  to = "/tools/paper-review/"
  status = 301

# LinkedIn short links: a post can carry purplelink.llc/li/<slug>, which is easy to type on a Mac after reading on a
# phone, and still lands tagged so analytics.js records the visit as channel "linkedin". 302, not 301, so a
# destination can change later. One exact rule per page and no /li/* wildcard: a wildcard would redirect any
# path and tag it. Netlify passes an incoming query string through to the destination; see
# site-tests/test_linkedin_redirects.py. The short paths are not in the sitemap or the search index.
[[redirects]]
  from = "/li/moderntex"
  to = "/moderntex/?utm_source=linkedin&utm_medium=social&utm_campaign=li-moderntex"
  status = 302

[[redirects]]
  from = "/li/vitae"
  to = "/vitae/?utm_source=linkedin&utm_medium=social&utm_campaign=li-vitae"
  status = 302

