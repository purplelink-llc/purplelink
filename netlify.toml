[build]
  publish = "site"

[functions]
  directory = "netlify/functions"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
    # style-src 'unsafe-inline' + the Google/AdSense origins below are a
    # deliberate, owner-authorized exception to the site's normal strict CSP
    # (see CLAUDE.md "AdSense exception") to allow Google AdSense to render.
    # AdSense injects inline ad-container styles and loads script/frame/img
    # content from these origins; without this the ad units silently fail.
    #
    # api.crossref.org, openlibrary.org, and export.arxiv.org in connect-src
    # are the citation generator's DOI, ISBN, and arXiv-ID lookups. They are
    # called directly from the browser and return Access-Control-Allow-Origin:
    # *. Without them every lookup fails with "Network error" (DOI/ISBN found
    # 2026-08-05; export.arxiv.org was missing entirely and confirmed still
    # broken 2026-09-20 during a site-wide CSP audit — arXiv-ID lookups had
    # never worked since the tool shipped).
    #
    # googleads.g.doubleclick.net and www.google.com in connect-src are for
    # the Google Ads conversion tag (gtag.js, AW-18464618488) on the
    # ModernTex funnel pages: gtag.js pings these via fetch/sendBeacon, not
    # just <img>, so img-src alone isn't enough — without connect-src too,
    # the conversion ping is silently dropped and Ads never records a sale
    # (found 2026-09-20, see docs/paper-review-runbook.md sibling note on the
    # GA4 import that never worked for the same reason: nothing was reaching
    # the tracker).
    Content-Security-Policy = "default-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data: https://pagead2.googlesyndication.com https://googleads.g.doubleclick.net https://www.google.com https://www.gstatic.com https://media.ethicalads.io https://www.google-analytics.com https://www.googletagmanager.com https://www.googleadservices.com https://ad.doubleclick.net https://*.adtrafficquality.google; script-src 'self' 'unsafe-inline' https://static.cloudflareinsights.com https://pagead2.googlesyndication.com https://googleads.g.doubleclick.net https://www.googletagservices.com https://tpc.googlesyndication.com https://media.ethicalads.io https://www.googletagmanager.com https://www.googleadservices.com https://www.google.com https://*.adtrafficquality.google; connect-src 'self' https://ben-ampel--purplelink-latextools-web.modal.run https://api.crossref.org https://openlibrary.org https://export.arxiv.org https://cloudflareinsights.com https://pagead2.googlesyndication.com https://server.ethicalads.io https://www.google-analytics.com https://*.google-analytics.com https://*.analytics.google.com https://www.googletagmanager.com https://googleads.g.doubleclick.net https://www.google.com https://www.googleadservices.com https://ad.doubleclick.net https://*.adtrafficquality.google; frame-src 'self' blob: https://googleads.g.doubleclick.net https://tpc.googlesyndication.com https://www.googletagmanager.com https://*.adtrafficquality.google https://www.google.com; object-src 'self' blob:"

# Fonts and self-hosted vendor scripts are inherently stable — keep them
# immutable. The catch-all /assets/* rule below uses a shorter cache so that
# non-fingerprinted assets (logos, icons, OG cards) can be replaced in place
# without serving stale copies for up to a year.
[[headers]]
  for = "/assets/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/assets/vendor/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000, stale-while-revalidate=604800"

# CSS and JS are fingerprinted: scripts/fingerprint_assets.py stamps every
# reference in site/*.html as ?v=<hash of the file's bytes>, so changing an
# asset changes its URL. That makes these safe to cache forever, and a fix
# reaches people on their next page load rather than whenever the old copy
# happened to expire. Before this, styles.css and site.js were cached for a
# day, which twice on 2026-09-04 left a deployed fix invisible to anyone who
# had already loaded the site.
#
# The stamp is what makes `immutable` correct here, so it must never be
# skipped: deploy.sh runs the script on every deploy, and the fingerprints are
# committed so a git-triggered build publishes the same HTML.
# These four are the exception: site/blog/digest/ is generated and committed by
# the Modal cron, which emits them unstamped, so their bare URLs must stay
# refreshable or an archive reader would hold year-old CSS. Fingerprinted pages
# still get a fix instantly, because ?v= makes the changed asset a new URL that
# no cached copy can answer; the day here only bounds the digest pages.
[[headers]]
  for = "/styles.css"
  [headers.values]
    Cache-Control = "public, max-age=86400, stale-while-revalidate=604800"

[[headers]]
  for = "/site.js"
  [headers.values]
    Cache-Control = "public, max-age=86400, stale-while-revalidate=604800"

[[headers]]
  for = "/analytics.js"
  [headers.values]
    Cache-Control = "public, max-age=86400, stale-while-revalidate=604800"

[[headers]]
  for = "/ethicalads.js"
  [headers.values]
    Cache-Control = "public, max-age=86400, stale-while-revalidate=604800"

# Everything under /tools/ is referenced only from stamped pages, so it can be
# cached hard. This also retires the revalidation round-trip those stylesheets
# and scripts were paying on every single page load.
[[headers]]
  for = "/tools/*.css"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/tools/*.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/sitemap.xml"
  [headers.values]
    Content-Type = "application/xml; charset=utf-8"
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/robots.txt"
  [headers.values]
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/llms.txt"
  [headers.values]
    Content-Type = "text/plain; charset=utf-8"
    Cache-Control = "public, max-age=86400"

# The OG-image generator is a build-time utility, not a public page.
# 404 any direct hit so it doesn't get crawled or indexed.
# `force = true` because the file still exists on disk; without it Netlify
# would serve the existing file rather than apply this redirect.
# Backend endpoint names that crawlers lifted from tool JS; send them to the tool pages.
[[redirects]]
  from = "/diff"
  to = "/tools/latex-diff/"
  status = 301

[[redirects]]
  from = "/validate-bib"
  to = "/tools/bib-validator/"
  status = 301

[[redirects]]
  from = "/assets/og/_gen.html"
  to = "/404.html"
  status = 404
  force = true

# The DMG was public for a few hours on 2026-09-04 before the paywall; anyone holding that
# link lands on the product page instead of a 404.
[[redirects]]
  from = "/moderntex/download/*"
  to = "/moderntex/"
  status = 301

[[redirects]]
  from = "/moderntex/appcast.xml"
  to = "/moderntex/"
  status = 301

# Vitae downloads go through a counted function (DMGs live in the vitae-files Blobs
# store, not site/). Rewrites, not redirects, so the URL the browser and installed
# copies' /vitae/version.json downloadURL see never changes.
[[redirects]]
  from = "/vitae/download"
  to = "/.netlify/functions/vitae-download"
  status = 200
  force = true

[[redirects]]
  from = "/vitae/Vitae-*"
  to = "/.netlify/functions/vitae-download?file=Vitae-:splat"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/404.html"
  status = 404
