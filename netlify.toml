# The OG-image generator is a build-time utility, not a public page.
# 404 any direct hit so it doesn't get crawled or indexed.
# `force = true` because the file still exists on disk; without it Netlify
# would serve the existing file rather than apply this redirect.
# Backend endpoint names that crawlers lifted from tool JS; send them to the tool pages.
# The Daily Digest archive (machine-compiled summaries, June 22 to October 17, 2026) was removed on 2026-10-17
# before the AdSense re-review. Old issue links go to the post that explains why it ended; the feed goes to the blog feed.
[[redirects]]
  from = "/blog/digest/feed.xml"
  to = "/blog/feed.xml"
  status = 301

[[redirects]]
  from = "/blog/digest/*"
  to = "/blog/keeping-up-when-your-research-crosses-fields/"
  status = 301

[[redirects]]
  from = "/blog/digest"
  to = "/blog/keeping-up-when-your-research-crosses-fields/"
  status = 301

# The 16 short "Why it matters" pages (an index and 15 explainers of 186 to 261 words) were removed on 2026-10-21
# before the AdSense re-review. Each explainer has a fuller section with the same id in the methodology guide.
