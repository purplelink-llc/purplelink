name: Site tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - run: npm install
      - name: Build output stays out of git
        # search-index.json and llms-full.txt are made by the build and the test helpers
        # (docs/designs/generated-files-at-build.md); a forced add would bring the merge conflicts back.
        run: |
          if [ -n "$(git ls-files site/search-index.json site/llms-full.txt)" ]; then
            echo "::error::site/search-index.json or site/llms-full.txt is tracked again. Run: git rm --cached site/search-index.json site/llms-full.txt"
            exit 1
          fi
      - name: Committed pages are bare
        # ?v= stamps are added by the build, not committed (docs/designs/generated-files-at-build.md, phase 2).
        run: python3 scripts/fingerprint_assets.py --check-bare
      - name: Stamp like the Netlify build
        # The tests below then see the HTML that ships. CI=true lets the script stamp this throwaway checkout.
        run: python3 scripts/fingerprint_assets.py && python3 scripts/fingerprint_assets.py --check
      - name: Node tests (netlify functions)
        run: node --experimental-test-module-mocks --test netlify/tests/*.test.mjs
      - name: Site integrity tests
        run: python3 -m unittest discover -s site-tests -t site-tests -v
