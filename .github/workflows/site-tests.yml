name: Site tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: npm install
      - name: Node tests (netlify functions)
        run: node --experimental-test-module-mocks --test netlify/tests/*.test.mjs
      - name: Site integrity tests
        run: python3 -m unittest discover -s site-tests -t site-tests -v
