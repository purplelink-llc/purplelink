<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<link rel="preload" href="/assets/fonts/fraunces-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="/assets/fonts/plus-jakarta-sans-latin.woff2" as="font" type="font/woff2" crossorigin>
<style>
  /* The card is rendered on its own, without styles.css, so declare the faces here. */
  @font-face { font-family: 'Fraunces'; font-weight: 300 900; src: url('/assets/fonts/fraunces-latin.woff2') format('woff2'); }
  @font-face { font-family: 'Plus Jakarta Sans'; font-weight: 400 700; src: url('/assets/fonts/plus-jakarta-sans-latin.woff2') format('woff2'); }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1200px; height: 630px; overflow: hidden; }
  .card {
    width: 1200px; height: 630px; position: relative;
    background:
      radial-gradient(1100px 700px at 78% -12%, oklch(40% 0.18 310) 0%, transparent 55%),
      radial-gradient(900px 600px at 8% 118%, oklch(34% 0.12 310) 0%, transparent 50%),
      oklch(18% 0.025 310);
    color: oklch(96% 0.01 310);
    font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
    padding: 86px 90px;
    display: flex; flex-direction: column; justify-content: space-between;
  }
  .top { display: flex; align-items: center; gap: 18px; }
  .top img { width: 56px; height: 56px; }
  .top .brand { font-family: 'Fraunces', serif; font-weight: 600; font-size: 34px; letter-spacing: -0.5px; }
  .eyebrow {
    display: inline-flex; align-items: center; gap: 12px;
    font-size: 22px; font-weight: 600; letter-spacing: 2px; text-transform: uppercase;
    color: oklch(82% 0.13 310);
  }
  .eyebrow .emoji { font-size: 34px; }
  .mid { display: flex; flex-direction: column; gap: 26px; }
  h1 {
    font-family: 'Fraunces', serif; font-weight: 600; font-size: 96px; line-height: 0.98;
    letter-spacing: -2px; max-width: 16ch;
  }
  .tagline { font-size: 36px; font-weight: 400; color: oklch(86% 0.02 300); max-width: 26ch; line-height: 1.3; }
  .bottom { display: flex; align-items: center; justify-content: space-between; }
  .url { font-size: 28px; font-weight: 600; color: oklch(80% 0.12 310); }
  .free { font-size: 24px; font-weight: 500; color: oklch(72% 0.03 300); }
</style>
</head>
<body>
  <div class="card">
    <div class="top">
      <img src="/assets/purplelink-logo.png" alt="">
      <span class="brand">Purplelink</span>
    </div>
    <div class="mid">
      <span class="eyebrow"><span class="emoji" id="emoji">∑</span> <span id="kicker">Free LaTeX tool</span></span>
      <h1 id="title">Tool</h1>
      <p class="tagline" id="tagline">Tagline</p>
    </div>
    <div class="bottom">
      <span class="url">purplelink.llc</span>
      <span class="free">No sign-up · Files never stored</span>
    </div>
  </div>
  <script>
    var TOOLS = {
      "bib-validator":     { emoji: "📚", title: "BibTeX Validator",   tagline: "Catch AI-hallucinated citations, dead DOIs & missing fields." },
      "bib-builder":       { emoji: "🔍", title: "BibTeX Builder",     tagline: "Paste DOIs or arXiv IDs, download a ready-to-use .bib file." },
      "equation-renderer": { emoji: "∑",  title: "Equation Renderer",  tagline: "Paste LaTeX math, download a high-resolution PNG." },
      "latex-to-pdf":      { emoji: "📄", title: "LaTeX → PDF",        tagline: "Upload a .tex file, get a compiled PDF — pdfLaTeX or XeLaTeX." },
      "latex-diff":        { emoji: "🔀", title: "LaTeX Diff",         tagline: "Upload two .tex versions, get a tracked-changes comparison PDF." },
      "latex-to-word":     { emoji: "📝", title: "LaTeX → Word",       tagline: "Convert a .tex paper into a clean double-spaced Word manuscript." },
      "word-to-latex":     { emoji: "🔄", title: "Word → LaTeX",       tagline: "Upload a .docx, download a .tex starting point via Pandoc." },
      "tools-launch":      { emoji: "🧰", title: "Free LaTeX Tools",   tagline: "Compile, convert, diff, validate & render — right in your browser.", kicker: "7 tools · now live" },
      "markdown-to-pdf":   { emoji: "📰", title: "Markdown → PDF & Word", tagline: "Paste or upload Markdown, download a clean PDF or Word file." },
      "pdf-tools":         { emoji: "📑", title: "PDF Tools",         tagline: "Merge, split & compress PDFs — merge and split in your browser." },
      "citation-generator":{ emoji: "🎓", title: "Citation Generator", tagline: "DOI, ISBN or arXiv → APA, MLA, Chicago & IEEE citations." },
      "reference-converter":{ emoji: "🔁", title: "Reference Converter", tagline: "Convert citations between BibTeX, RIS & EndNote." },
      "latex-table-generator":{ emoji: "📊", title: "LaTeX Table Generator", tagline: "Paste CSV or TSV data, get a clean booktabs LaTeX table." },
      "word-counter":      { emoji: "🔢", title: "Word Counter",      tagline: "Live word, character, sentence & reading-time stats." },
      "file-to-markdown":  { emoji: "📝", title: "File to Markdown",  tagline: "Convert PDF, Word, PowerPoint, Excel, HTML & CSV to clean Markdown." },
      "vitae":             { emoji: "§",  title: "Vitae", tagline: "Your CV, submissions, grants and tenure case, tracked on your Mac.", kicker: "Free Mac app", foot: "Free · Local-first · Your data stays on your Mac" },
      "paper-review":      { emoji: "", title: "Paper Review", tagline: "Four AI reviewers read your manuscript before the journal does.", kicker: "Pre-submission review · from $9", foot: "No account · Nothing kept after delivery" },
      "anonymity-check":   { emoji: "", title: "Anonymity Check", tagline: "Find what gives authors away before double-blind review.", kicker: "Before you submit · $2", foot: "No account · Nothing kept after delivery" },
      "citation-gap":      { emoji: "", title: "Citation Gap", tagline: "Find the prior work your manuscript should cite and doesn't.", kicker: "Before you submit · $3", foot: "No account · Nothing kept after delivery" },
      "cover-letter":      { emoji: "", title: "Cover Letter", tagline: "A journal cover letter drafted from your abstract and target venue.", kicker: "Before you submit · $2", foot: "No account · Nothing kept after delivery" },
      "response-review":   { emoji: "", title: "Response Review", tagline: "A reviewer panel reads your response letter before the editor does.", kicker: "Before you resubmit · $6", foot: "No account · Nothing kept after delivery" },
      "pdf-structure":     { emoji: "", title: "PDF to Structured Data", tagline: "Reading-order Markdown and RAG-ready JSON from any PDF.", kicker: "Free tool" },
      "scholar-utility-belt": { emoji: "", title: "Scholar Utility Belt", tagline: "Journal rankings, author metrics and retraction alerts in Google Scholar.", kicker: "Free Chrome extension", foot: "No tracking · No account · MIT-licensed" },
      "products":          { emoji: "", title: "Tools for the paper", tagline: "Mac apps and manuscript checks for researchers, from first draft to accepted.", kicker: "Purplelink products", foot: "ModernTex · Vitae · Paper Review" },
      "overleaf-alternative-mac": { emoji: "", title: "Overleaf alternatives for Mac", tagline: "Offline LaTeX editors compared, and how to keep Overleaf for co-authors.", kicker: "Mac LaTeX guide", foot: "Free guides for academic authors" },
      "get-feedback-on-a-paper": { emoji: "", title: "Feedback before you submit", tagline: "Colleagues, editors, AI assistants, preprints and Paper Review, compared honestly.", kicker: "Guide", foot: "Free guides for academic authors" },
      "ai-policy":         { emoji: "", title: "Using AI on your own manuscript", tagline: "What ten publisher and venue policies allow authors, and what to disclose.", kicker: "Guide", foot: "Free guides for academic authors" },
      "labs":              { emoji: "", title: "For labs and departments", tagline: "Volume pricing, invoices, purchase orders, and where a manuscript goes.", kicker: "Purplelink", foot: "purplelink.llc/labs" },
      "desk":              { emoji: "", title: "The research desk", tagline: "Books and tools for academic writers, with a note on who each one is for.", kicker: "Recommendations", foot: "purplelink.llc/desk" },
      "submission-checklist": { emoji: "", title: "Submission checklist", tagline: "Twelve checks before you submit a paper, each with a tool that does it.", kicker: "Free interactive tool" },
      "templates":         { emoji: "", title: "LaTeX templates by venue", tagline: "IEEE, ACM, NeurIPS, Elsevier and APA 7: compilable skeletons and the pitfalls.", kicker: "Free guides", foot: "Free guides for academic authors" },
      "why-it-matters":    { emoji: "", title: "Why it matters", tagline: "The methodology problems peer reviewers flag, and how to fix them.", kicker: "Research methods", foot: "Free guides for academic authors" },
      "brand":             { emoji: "✦",  title: "Purplelink",       tagline: "macOS & iOS apps, applied AI, and free tools for academics.", kicker: "Purplelink LLC" }
    };
    window.renderTool = function (key) {
      var t = TOOLS[key];
      document.getElementById("emoji").textContent = t.emoji;
      document.getElementById("emoji").hidden = !t.emoji;
      document.getElementById("kicker").textContent = t.kicker || "Free LaTeX tool";
      document.getElementById("title").textContent = t.title;
      document.getElementById("tagline").textContent = t.tagline;
      if (t.foot) document.querySelector(".free").textContent = t.foot;
      document.title = key;
      return t.title;
    };
    window.renderTool(new URLSearchParams(location.search).get("t") || "equation-renderer");
  </script>
    <script src="/analytics.js?v=e10d5c8c43" defer></script>
  </body>
</html>
