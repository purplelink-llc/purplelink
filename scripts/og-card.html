<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="robots" content="noindex, nofollow">
<style>
  @font-face { font-family: 'Fraunces'; font-weight: 300 900; src: url('/site/assets/fonts/fraunces-latin.woff2') format('woff2'); }
  @font-face { font-family: 'Plus Jakarta Sans'; font-weight: 400 700; src: url('/site/assets/fonts/plus-jakarta-sans-latin.woff2') format('woff2'); }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1200px; height: 630px; overflow: hidden; background: #140a22; }
  .card { width: 1200px; height: 630px; position: relative; color: oklch(96% 0.01 310);
    font-family: 'Plus Jakarta Sans', system-ui, sans-serif; padding: 70px 90px 64px;
    display: flex; flex-direction: column; justify-content: space-between; background-size: cover; background-position: center; }
  .card::before { content: ""; position: absolute; inset: 0;
    background: linear-gradient(90deg, rgba(14,6,26,.78) 0%, rgba(14,6,26,.55) 45%, rgba(14,6,26,0) 80%); }
  .card > * { position: relative; }
  .top { display: flex; align-items: center; gap: 18px; }
  .top img { width: 52px; height: 52px; }
  .top .brand { font-family: 'Fraunces', serif; font-weight: 600; font-size: 32px; letter-spacing: -0.5px; }
  .mid { display: flex; flex-direction: column; gap: 22px; max-width: 760px; }
  .eyebrow { font-size: 22px; font-weight: 600; letter-spacing: 2px; text-transform: uppercase; color: oklch(84% 0.12 310); }
  h1 { font-family: 'Fraunces', serif; font-weight: 600; line-height: 1.02; letter-spacing: -1.5px; }
  .tagline { font-size: 32px; font-weight: 400; color: oklch(88% 0.02 300); line-height: 1.3; max-width: 22em; }
  .bottom { display: flex; align-items: center; justify-content: space-between; }
  .url { font-size: 27px; font-weight: 600; color: oklch(82% 0.12 310); }
  .free { font-size: 23px; font-weight: 500; color: oklch(80% 0.03 300); }
</style></head>
<body><div class="card" id="card">
  <div class="top"><img src="/site/assets/purplelink-logo.png" alt=""><span class="brand">Purplelink</span></div>
  <div class="mid"><span class="eyebrow" id="kicker"></span><h1 id="title"></h1><p class="tagline" id="tagline"></p></div>
  <div class="bottom"><span class="url">purplelink.llc</span><span class="free" id="foot"></span></div>
</div>
<script>
  const q = new URLSearchParams(location.search);
  document.getElementById('card').style.backgroundImage = "url('/site/assets/og/bg/" + (q.get('bg') || 'general') + ".jpg')";
  const t = q.get('t') || '';
  const h = document.getElementById('title'); h.textContent = t;
  h.style.fontSize = (t.length <= 24 ? 92 : t.length <= 40 ? 76 : t.length <= 58 ? 62 : 52) + 'px';
  document.getElementById('kicker').textContent = q.get('k') || '';
  document.getElementById('tagline').textContent = q.get('s') || '';
  document.getElementById('foot').textContent = q.get('f') || '';
</script></body></html>
