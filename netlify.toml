# The DMG was public for a few hours on 2026-09-04 before the paywall; anyone holding that
# link lands on the product page instead of a 404.
[[redirects]]
  from = "/moderntex/download/*"
  to = "/moderntex/"
  status = 301

[[redirects]]
  from = "/moderntex/appcast.xml"
  to = "/moderntex/"
  status = 301

# Vitae downloads go through a counted function (DMGs live in the vitae-files Blobs
# store, not site/). Rewrites, not redirects, so the URL the browser and installed
# copies' /vitae/version.json downloadURL see never changes.
[[redirects]]
  from = "/vitae/download"
  to = "/.netlify/functions/vitae-download"
  status = 200
  force = true

[[redirects]]
  from = "/vitae/Vitae-*"
  to = "/.netlify/functions/vitae-download?file=Vitae-:splat"
  status = 200
  force = true

# BatteryMeter's Sparkle appcast and release zips are served from the batterymeter-files Blobs store through
# batterymeter-download (the function sets the headers: appcast 5-minute cache, zips long cache), so a release
# needs no site build. Rewrites, not redirects: the URLs installed copies and the product page use do not change.
# site/batterymeter/ must not hold copies of these files: they would be dead weight that drifts from the store.
[[redirects]]
  from = "/batterymeter/appcast.xml"
  to = "/.netlify/functions/batterymeter-download?file=appcast.xml"
  status = 200
  force = true

[[redirects]]
  from = "/batterymeter/BatteryMeter-*"
  to = "/.netlify/functions/batterymeter-download?file=BatteryMeter-:splat"
  status = 200
  force = true

# Public image host for the social poster (Threads fetches images from a public URL). Read-only, served from the
# dedicated social-media Blobs store by social-media.mjs; only <40 hex>.png|jpg|jpeg keys resolve.
[[redirects]]
  from = "/social-media/*"
